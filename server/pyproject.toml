[project]
name = "cfd-server"
version = "0.1.0"
description = "Tier-2 OpenFOAM-backed validation, calibration, and multi-objective optimization for the HVAC CFD tool"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "PyVista>=0.43",
    "ofpp>=0.12.0; python_version<'4'",
    "pythermalcomfort>=2.10.0",
    "pymoo>=0.6.1",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cfd_server*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
